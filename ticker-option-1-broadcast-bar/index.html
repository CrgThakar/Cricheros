<style>
  :root{
    --ink:#eef3ff;
    --muted:#9fb0d0;
    --gold:#ffc845;
    --green:#1ec873;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060a;}
  .viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05060a;}
  .stage{
    position:relative;width:1920px;height:1080px;overflow:hidden;flex:none;
    transform-origin:center center;font-family:'Barlow Semi Condensed',sans-serif;
    background:radial-gradient(120% 80% at 50% -10%, #0b3a5a 0%, #06182b 45%, #04101d 100%);
  }
  .backdrop{position:absolute;inset:0;overflow:hidden;
    background:#04101d url("assets/stream-frame.webp") center/cover no-repeat;}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%, transparent 50%, rgba(0,0,0,.55) 100%);}

  /* ===================== SCORE BAR (two-tier) ===================== */
  .scorebar{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);width:1720px;z-index:5;}
  .deck{position:relative;}

  /* team caps (sit on top, peeking above tier 1 — labels only, never over data) */
  /* Tier 1 sits at z-index 3 and covers the lower part of each cap, so the peek
     above it has to clear the tallest cap content (the 44px badge starting at
     14px padding = 58px). At -38px both team names were cut roughly in half. */
  .caps{position:absolute;left:0;right:0;top:-64px;height:90px;z-index:2;}
  .cap{position:absolute;top:0;height:90px;width:470px;
    display:flex;align-items:flex-start;gap:16px;padding:14px 28px 0;
    border-radius:18px 18px 4px 4px;
    box-shadow:0 10px 24px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.35);overflow:hidden;}
  .cap::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 42%);pointer-events:none;}
  .cap.left{left:0;background:linear-gradient(160deg,#19c2b6,#0a8c83 60%,#077069);}
  .cap.right{right:0;justify-content:flex-end;text-align:right;
    background:linear-gradient(200deg,#3b6dff,#1f47d6 60%,#1736ad);}
  .cap .mono{width:44px;height:44px;border-radius:50%;flex:none;background:rgba(255,255,255,.92);
    color:#0a2540;display:flex;align-items:center;justify-content:center;
    font-family:'Saira Condensed';font-weight:800;font-size:21px;letter-spacing:.5px;
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.2);}
  .cap.right .mono{color:#11235e;}
  .cap .tname{font-family:'Saira Condensed';font-weight:700;font-size:30px;letter-spacing:.6px;
    color:#fff;text-transform:uppercase;line-height:1;padding-top:8px;white-space:nowrap;
    text-shadow:0 2px 6px rgba(0,0,0,.35);}

  /* ---------- TIER 1 : players + score ---------- */
  .tier1{position:relative;z-index:3;height:150px;border-radius:16px 16px 0 0;
    display:grid;grid-template-columns:1fr 524px 1fr;align-items:stretch;
    background:linear-gradient(180deg,#1a2748 0%,#0c1430 58%,#080d1f 100%);
    box-shadow:0 -2px 0 rgba(255,255,255,.06) inset, inset 0 2px 0 rgba(255,255,255,.12);}

  .batting{padding:16px 30px 14px 38px;display:flex;flex-direction:column;justify-content:center;}
  .bat-row{display:flex;align-items:center;gap:14px;height:55px;}
  .bat-row.div{border-top:1px solid rgba(255,255,255,.1);}
  .strike{width:0;height:0;flex:none;border-top:9px solid transparent;border-bottom:9px solid transparent;
    border-left:14px solid var(--gold);filter:drop-shadow(0 0 6px rgba(255,200,69,.8));}
  .strike.hidden{visibility:hidden;}
  .bat-name{font-weight:600;font-size:32px;color:var(--ink);letter-spacing:.3px;white-space:nowrap;min-width:230px;}
  .bat-row.second .bat-name{color:#cdd8ef;}
  .bat-stat{margin-left:auto;display:flex;align-items:baseline;gap:9px;white-space:nowrap;}
  .bat-runs{font-family:'Saira Condensed';font-weight:800;font-size:38px;color:#fff;line-height:1;}
  .bat-balls{font-family:'Saira Condensed';font-weight:600;font-size:23px;color:var(--muted);}
  .bat-sr{font-family:'Barlow Condensed';font-weight:600;font-size:18px;color:var(--gold);letter-spacing:.5px;
    border-left:1px solid rgba(255,255,255,.16);padding-left:11px;margin-left:4px;}

  .bowling{padding:16px 38px 14px 30px;display:flex;flex-direction:column;justify-content:center;gap:14px;}
  .bowl-top{display:flex;align-items:baseline;gap:15px;justify-content:flex-end;}
  .bowl-name{font-weight:600;font-size:32px;color:var(--ink);letter-spacing:.3px;white-space:nowrap;}
  .bowl-fig{font-family:'Saira Condensed';font-weight:800;font-size:34px;color:#fff;white-space:nowrap;}
  .bowl-fig small{font-weight:600;font-size:23px;color:var(--muted);}
  .bowl-ov{font-family:'Barlow Condensed';font-weight:600;font-size:20px;color:var(--gold);letter-spacing:.5px;}
  .over-row{display:flex;align-items:center;gap:12px;justify-content:flex-end;}
  .over-row .olab{font-family:'Barlow Condensed';font-weight:600;font-size:16px;color:var(--muted);
    letter-spacing:1.5px;text-transform:uppercase;margin-right:2px;}
  .ball{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-family:'Saira Condensed';font-weight:800;font-size:21px;color:#fff;
    background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.22);box-shadow:inset 0 2px 4px rgba(0,0,0,.3);}
  .ball.b0{background:linear-gradient(180deg,#33415e,#222d44);color:#cdd8ef;}
  .ball.b1{background:linear-gradient(180deg,#33415e,#222d44);color:#fff;}
  .ball.b4{background:linear-gradient(180deg,#28e07a,#13a85a);}
  .ball.b6{background:linear-gradient(180deg,#ffd35a,#f2a516);color:#3a2400;}
  .ball.bw{background:linear-gradient(180deg,#ff385f,#d2002f);}
  .ball.empty{background:rgba(255,255,255,.03);border-style:dashed;border-color:rgba(255,255,255,.16);}

  /* the hero score block — pops UP over the bar (vertical overlap only, no data behind it) */
  .hero{position:absolute;left:50%;top:-30px;transform:translateX(-50%);
    width:520px;height:180px;z-index:4;
    display:flex;align-items:center;justify-content:center;gap:18px;
    clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);
    background:linear-gradient(180deg,#ff1a44,#d2002f 55%,#9e0322);
    box-shadow:0 18px 38px rgba(180,0,40,.5), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -3px 8px rgba(0,0,0,.35);}
  .hero::after{content:"";position:absolute;inset:0;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);
    background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 46%);pointer-events:none;}
  .hero .shine{position:absolute;top:0;bottom:0;width:80px;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);
    transform:skewX(-18deg);left:-120px;}
  .score{font-family:'Saira Condensed';font-weight:900;font-size:84px;color:#fff;line-height:.88;
    letter-spacing:1px;text-shadow:0 3px 10px rgba(0,0,0,.4);position:relative;}
  .overs{display:flex;flex-direction:column;line-height:1;position:relative;align-items:flex-start;}
  .overs b{font-family:'Saira Condensed';font-weight:800;font-size:40px;color:#fff;}
  .overs span{font-family:'Barlow Condensed';font-weight:600;font-size:18px;color:#ffd9df;
    letter-spacing:2px;text-transform:uppercase;}

  /* ---------- TIER 2 : one clean full-width data band ---------- */
  .tier2{position:relative;z-index:3;height:60px;border-radius:0 0 16px 16px;
    display:grid;grid-template-columns:0.92fr 1.3fr 0.82fr 0.82fr 1.15fr 1fr;align-items:center;
    background:linear-gradient(180deg,#161d31 0%,#0a0e1b 100%);
    border-top:1.5px solid rgba(255,200,69,.5);
    box-shadow:0 22px 46px rgba(0,0,0,.55);}
  .seg{display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1;gap:5px;position:relative;}
  .seg + .seg::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:rgba(255,255,255,.12);}
  .seg .lab{font-family:'Barlow Condensed';font-weight:600;font-size:14px;color:var(--muted);
    letter-spacing:1.6px;text-transform:uppercase;}
  .seg .val{font-family:'Saira Condensed';font-weight:800;font-size:25px;color:#fff;white-space:nowrap;}
  .seg .val b{color:var(--gold);}
  .seg .val small{font-family:'Barlow Semi Condensed';font-weight:600;font-size:18px;color:var(--muted);}

  /* ===================== ANIMATIONS ===================== */
  @media (prefers-reduced-motion: no-preference){
    .cap.left{animation:capL .7s cubic-bezier(.2,.8,.2,1) both;}
    .cap.right{animation:capR .7s cubic-bezier(.2,.8,.2,1) both;}
    .tier1{animation:rise .7s .1s cubic-bezier(.2,.8,.2,1) both;}
    .tier2{animation:rise .6s .42s cubic-bezier(.2,.8,.2,1) both;}
    .hero{animation:pop .6s .34s cubic-bezier(.2,1.2,.3,1) both;}
    .bat-row.first{animation:slideL .5s .3s cubic-bezier(.2,.8,.2,1) both;}
    .bat-row.second{animation:slideL .5s .4s cubic-bezier(.2,.8,.2,1) both;}
    .bowl-top{animation:slideR .5s .34s cubic-bezier(.2,.8,.2,1) both;}
    .over-row .ball{animation:bp .4s cubic-bezier(.2,1.4,.3,1) both;}
    .over-row .ball:nth-child(2){animation-delay:.5s;}.over-row .ball:nth-child(3){animation-delay:.57s;}
    .over-row .ball:nth-child(4){animation-delay:.64s;}.over-row .ball:nth-child(5){animation-delay:.71s;}
    .over-row .ball:nth-child(6){animation-delay:.78s;}.over-row .ball:nth-child(7){animation-delay:.85s;}
    .seg{animation:fade .5s cubic-bezier(.2,.8,.2,1) both;}
    .seg:nth-child(1){animation-delay:.5s}.seg:nth-child(2){animation-delay:.56s}.seg:nth-child(3){animation-delay:.62s}
    .seg:nth-child(4){animation-delay:.68s}.seg:nth-child(5){animation-delay:.74s}.seg:nth-child(6){animation-delay:.8s}
    .hero .shine{animation:sweep 5.5s 1.4s ease-in-out infinite;}
    .strike:not(.hidden){animation:strikePulse 1.6s 1.2s ease-in-out infinite;}
  }
  @keyframes capL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
  @keyframes capR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.82)}to{opacity:1;transform:translateX(-50%) scale(1)}}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes slideL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @keyframes slideR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes bp{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
  @keyframes sweep{0%{left:-120px}18%,100%{left:120%}}
  @keyframes strikePulse{0%,100%{filter:drop-shadow(0 0 4px rgba(255,200,69,.6))}50%{filter:drop-shadow(0 0 12px rgba(255,200,69,1))}}
</style>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <div class="viewport">
  <div class="stage">
    <!-- Demo backdrop only. In OBS this layer is the stream itself. -->
    <div class="backdrop">
    </div>
    <div class="vignette"></div>

    <div class="scorebar" id="scorebar">
      <span class="scorebar-sweep" aria-hidden="true"></span>
      <div class="caps">
        <div class="cap left"><div class="mono">CC</div><div class="tname">Champions CC</div></div>
        <div class="cap right"><div class="tname">Gujarat CC</div><div class="mono">GC</div></div>
      </div>

      <div class="deck">
        <!-- TIER 1 -->
        <div class="tier1">
          <div class="batting" id="batting">
            <div class="bat-row first">
              <div class="strike"></div>
              <div class="bat-name">Mayur Vasyani</div>
              <div class="bat-stat"><div class="bat-runs">23</div><div class="bat-balls">(41)</div><div class="bat-sr">SR 56.1</div></div>
            </div>
            <div class="bat-row second div">
              <div class="strike hidden"></div>
              <div class="bat-name">Vinay Vasyani</div>
              <div class="bat-stat"><div class="bat-runs">47</div><div class="bat-balls">(36)</div><div class="bat-sr">SR 130.6</div></div>
            </div>
          </div>

          <div></div>

          <div class="bowling">
            <div class="bowl-top">
              <div class="bowl-name" id="bowlName">Abhay Tomar</div>
              <div class="bowl-fig" id="bowlFig">32<small>-0</small></div>
              <div class="bowl-ov" id="bowlOv">(5.2)</div>
            </div>
            <div class="over-row" id="overRow">
              <div class="olab">This Over</div>
              <div class="ball b1">1</div><div class="ball b0">0</div>
              <div class="ball empty"></div><div class="ball empty"></div>
              <div class="ball empty"></div><div class="ball empty"></div>
            </div>
          </div>
        </div>

        <!-- HERO (pops up over tier 1 center, nothing behind it) -->
        <div class="hero" id="hero">
          <span class="shine"></span>
          <div class="score" id="score">129/5</div>
          <div class="overs"><b id="overs">23.2</b><span>Overs</span></div>
        </div>

        <!-- TIER 2 : clean full-width data band -->
        <div class="tier2" id="tier2">
          <div class="seg"><div class="lab">Target</div><div class="val">229</div></div>
          <div class="seg"><div class="lab">Need</div><div class="val"><b>100</b> <small>off</small> 176</div></div>
          <div class="seg"><div class="lab">CRR</div><div class="val">5.56</div></div>
          <div class="seg"><div class="lab">RRR</div><div class="val">3.41</div></div>
          <div class="seg"><div class="lab">Partnership</div><div class="val">70 <small>(77)</small></div></div>
          <div class="seg"><div class="lab">Last Wkt</div><div class="val">59-5</div></div>
        </div>
      </div>
    </div>
    <div class="burst" id="burst" aria-hidden="true"><span class="burst-word"></span><span class="burst-sub"></span></div>
  </div>
  </div>
  <div class="rail" id="rail">
    <div class="rail-head"><b>Match events</b><button type="button" id="railHide" title="Hide controls (H)">Hide</button></div>
    <div class="rail-grid">
      <button type="button" data-ev="dot">Dot ball</button>
      <button type="button" data-ev="run1">Single</button>
      <button type="button" data-ev="run2">Two</button>
      <button type="button" data-ev="four">FOUR</button>
      <button type="button" data-ev="six">SIX</button>
      <button type="button" data-ev="wicket">WICKET</button>
      <button type="button" data-ev="over">End of over</button>
      <button type="button" data-ev="reset">Reset</button>
    </div>
    <label class="rail-auto"><input type="checkbox" id="autoPlay"> Auto-play demo</label>
  </div>
  <button type="button" class="rail-show" id="railShow" title="Show controls (H)">Controls</button>
  <script src="js/script.js"></script>
</body></html>
